<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bodenpuls Systemübersicht</title>
<style>
body{margin:0;background:#f6f4f0;font-family:system-ui,sans-serif}
svg{max-width:100%;height:auto;display:block;margin:0 auto}
</style>
</head>
<body>
<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund -->
  <rect width="1200" height="700" rx="24" fill="#ffffff" stroke="#e0e0e0"/>

  <!-- Zonen oben (1-3) -->
  <g id="zone1">
    <rect x="80" y="60" width="280" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="220" y="50" text-anchor="middle" font-size="18" fill="#222">Zone 1</text>
    <line x1="100" y1="100" x2="340" y2="100" stroke="#ccc"/>
    <line x1="100" y1="120" x2="340" y2="120" stroke="#ccc"/>
    <line x1="100" y1="140" x2="340" y2="140" stroke="#ccc"/>
    <circle cx="220" cy="130" r="10" fill="#fff" stroke="#333"/>
  </g>
  <g id="zone2">
    <rect x="460" y="60" width="280" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="600" y="50" text-anchor="middle" font-size="18" fill="#222">Zone 2</text>
    <line x1="480" y1="100" x2="720" y2="100" stroke="#ccc"/>
    <line x1="480" y1="120" x2="720" y2="120" stroke="#ccc"/>
    <line x1="480" y1="140" x2="720" y2="140" stroke="#ccc"/>
    <circle cx="600" cy="130" r="10" fill="#fff" stroke="#333"/>
  </g>
  <g id="zone3">
    <rect x="840" y="60" width="280" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="980" y="50" text-anchor="middle" font-size="18" fill="#222">Zone 3</text>
    <line x1="860" y1="100" x2="1100" y2="100" stroke="#ccc"/>
    <line x1="860" y1="120" x2="1100" y2="120" stroke="#ccc"/>
    <line x1="860" y1="140" x2="1100" y2="140" stroke="#ccc"/>
    <circle cx="980" cy="130" r="10" fill="#fff" stroke="#333"/>
  </g>

  <!-- Zonen unten (4-7) -->
  <g id="zone4">
    <rect x="40" y="280" width="240" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="160" y="270" text-anchor="middle" font-size="18" fill="#222">Zone 4</text>
    <line x1="60" y1="320" x2="260" y2="320" stroke="#ccc"/>
    <line x1="60" y1="340" x2="260" y2="340" stroke="#ccc"/>
    <line x1="60" y1="360" x2="260" y2="360" stroke="#ccc"/>
    <circle cx="160" cy="350" r="10" fill="#fff" stroke="#333"/>
  </g>
  <g id="zone5">
    <rect x="320" y="280" width="240" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="440" y="270" text-anchor="middle" font-size="18" fill="#222">Zone 5</text>
    <line x1="340" y1="320" x2="540" y2="320" stroke="#ccc"/>
    <line x1="340" y1="340" x2="540" y2="340" stroke="#ccc"/>
    <line x1="340" y1="360" x2="540" y2="360" stroke="#ccc"/>
    <circle cx="440" cy="350" r="10" fill="#fff" stroke="#333"/>
  </g>
  <g id="zone6">
    <rect x="600" y="280" width="240" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="720" y="270" text-anchor="middle" font-size="18" fill="#222">Zone 6</text>
    <line x1="620" y1="320" x2="820" y2="320" stroke="#ccc"/>
    <line x1="620" y1="340" x2="820" y2="340" stroke="#ccc"/>
    <line x1="620" y1="360" x2="820" y2="360" stroke="#ccc"/>
    <circle cx="720" cy="350" r="10" fill="#fff" stroke="#333"/>
  </g>
  <g id="zone7">
    <rect x="880" y="280" width="240" height="140" rx="16" fill="#f5f5f5" stroke="#333"/>
    <text x="1000" y="270" text-anchor="middle" font-size="18" fill="#222">Zone 7</text>
    <line x1="900" y1="320" x2="1100" y2="320" stroke="#ccc"/>
    <line x1="900" y1="340" x2="1100" y2="340" stroke="#ccc"/>
    <line x1="900" y1="360" x2="1100" y2="360" stroke="#ccc"/>
    <circle cx="1000" cy="350" r="10" fill="#fff" stroke="#333"/>
  </g>

  <!-- Leitungen (orange, ohne Kreuzung) -->
  <!-- Zone 1 -->
  <path d="M220 200 L220 240 L160 240 L160 280" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 2 -->
  <path d="M600 200 L600 240 L440 240 L440 280" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 3 -->
  <path d="M980 200 L980 240 L720 240 L720 280" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 4 -->
  <path d="M160 420 L160 460 L200 460 L200 500" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 5 -->
  <path d="M440 420 L440 460 L360 460 L360 500" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 6 -->
  <path d="M720 420 L720 460 L560 460 L560 500" stroke="#e85d04" stroke-width="2" fill="none"/>
  <!-- Zone 7 -->
  <path d="M1000 420 L1000 460 L760 460 L760 500" stroke="#e85d04" stroke-width="2" fill="none"/>

  <!-- Sammelleitung unten -->
  <line x1="200" y1="500" x2="760" y2="500" stroke="#e85d04" stroke-width="2"/>

  <!-- Steuerung, Ventile, Schütz -->
  <rect x="300" y="520" width="120" height="70" rx="8" fill="#fff" stroke="#333"/>
  <text x="360" y="555" text-anchor="middle" font-size="14" fill="#222">Ventile</text>
  <text x="360" y="572" text-anchor="middle" font-size="11" fill="#666">(nicht enthalten)</text>

  <rect x="460" y="520" width="120" height="70" rx="8" fill="#fff" stroke="#333"/>
  <text x="520" y="555" text-anchor="middle" font-size="14" fill="#222">Steuerung</text>

  <rect x="620" y="520" width="140" height="70" rx="8" fill="#fff" stroke="#333"/>
  <text x="690" y="550" text-anchor="middle" font-size="13" fill="#222">Schütz für Pumpe</text>
  <text x="690" y="567" text-anchor="middle" font-size="11" fill="#666">(nicht enthalten)</text>

  <!-- Verbindungen Steuerung -->
  <line x1="420" y1="555" x2="460" y2="555" stroke="#e85d04" stroke-width="2"/>
  <line x1="580" y1="555" x2="620" y2="555" stroke="#e85d04" stroke-width="2"/>
  <text x="600" y="545" text-anchor="middle" font-size="11" fill="#e85d04">A1 24V</text>

  <!-- Quelle -->
  <line x1="360" y1="590" x2="360" y2="640" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="655" text-anchor="middle" font-size="13" fill="#222">Quelle: Wasseranschluss</text>
  <text x="360" y="672" text-anchor="middle" font-size="11" fill="#666">7 Ventilausgänge 24V</text>

  <line x1="690" y1="590" x2="690" y2="640" stroke="#333" stroke-width="1.5"/>
  <text x="690" y="655" text-anchor="middle" font-size="13" fill="#222">Oder Quelle: Pumpe</text>

  <!-- Sensor-Hinweis -->
  <text x="40" y="220" font-size="13" fill="#333">Sensoren</text>
  <text x="40" y="238" font-size="12" fill="#555">ca. 20 cm Abstand</text>
  <text x="40" y="254" font-size="12" fill="#555">zum Tropf/Pflanze</text>
  <text x="40" y="270" font-size="12" fill="#555">10–30 cm Tiefe</text>
</svg>
</body>
</html>
