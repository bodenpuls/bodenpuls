  <text x="40" y="220" font-size="13" fill="#333">Sensoren</text>
  <text x="40" y="238" font-size="12" fill="#555">ca. 20 cm Abstand</text>
  <text x="40" y="254" font-size="12" fill="#555">zum Tropf/Pflanze</text>
  <text x="40" y="270" font-size="12" fill="#555">10–30 cm Tiefe</text>
